name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded PR commits can stop; every main push gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

      - name: Unit and pilot tests
        run: npm test

  browser:
    runs-on: ubuntu-latest
    env:
      # run.mjs skips its automatic install because CI installs the browser explicitly below.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Playwright version
        id: playwright
        run: node -p '"version=" + require("@playwright/test/package.json").version' >> "$GITHUB_OUTPUT"

      - name: Cache browser binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Also install Linux libraries on cache hits. Playwright reuses existing binaries.
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium

      - name: Build web workspace
        run: npm run build --workspace=apps/web

      - name: Browser tests
        run: npm run test:e2e --workspace=apps/web

  # Keep the existing check name, and fail it if either suite fails or is canceled/skipped.
  check:
    if: ${{ always() }}
    needs: [quality, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require both suites to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BROWSER_RESULT" = success
