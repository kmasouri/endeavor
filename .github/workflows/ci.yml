name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded PR commits can stop; every main push gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validation:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # One failed check cancels the queued/running checks in this workflow run.
      fail-fast: true
      matrix:
        include:
          - name: lint
            browser: false
            command: npm run lint
          - name: types
            browser: false
            command: npm run typecheck
          - name: build
            browser: false
            command: npm run build
          - name: unit and pilot tests
            browser: false
            command: npm test
          - name: browser (1/4)
            browser: true
            command: --shard=1/4 --max-failures=1
          - name: browser (2/4)
            browser: true
            command: --shard=2/4 --max-failures=1
          - name: browser (3/4)
            browser: true
            command: --shard=3/4 --max-failures=1
          - name: browser (4/4)
            browser: true
            command: --shard=4/4 --max-failures=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        if: ${{ !matrix.browser }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: ${{ !matrix.browser }}
        run: npm ci

      - name: Cache browser npm downloads
        if: matrix.browser
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/endeavor-ci-browser-npm
          key: browser-npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '.nvmrc') }}

      - name: Run browser shard in the prepared image
        if: matrix.browser
        env:
          CHECK_COMMAND: ${{ matrix.command }}
          CI_BROWSER_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
        shell: bash
        run: |
          set -euo pipefail
          read -r -a options <<< "$CHECK_COMMAND"
          workspace="$GITHUB_WORKSPACE"
          image="$CI_BROWSER_IMAGE"
          cache="${CI_BROWSER_NPM_CACHE:-${RUNNER_TEMP:-/tmp}/endeavor-ci-browser-npm}"
          mkdir -p -- "$cache"
          cache="$(cd -- "$cache" && pwd)"
          container="endeavor-ci-browser-${BASHPID}-${RANDOM}"

          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            if [[ -n "${docker_pid:-}" ]]; then wait "$docker_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          docker pull "$image"
          docker run --rm --init --ipc=host --pull=never --name "$container" \
            --mount "type=bind,source=$workspace,target=/work" \
            --mount "type=bind,source=$cache,target=/root/.npm" \
            --workdir /work \
            --env CI=true --env "CI_BROWSER_IMAGE=$image" \
            "$image" bash -euo pipefail -c '
              node <<"NODE"
          const fs = require("node:fs");
          const expectedNodeMajor = fs.readFileSync(".nvmrc", "utf8").trim().replace(/^v/, "").split(".")[0];
          if (process.versions.node.split(".")[0] !== expectedNodeMajor) {
            throw new Error(`CI browser image must provide Node ${expectedNodeMajor}; found ${process.version}`);
          }
          const expectedPlaywright = JSON.parse(fs.readFileSync("apps/web/package.json", "utf8")).devDependencies["@playwright/test"];
          if (!process.env.CI_BROWSER_IMAGE.startsWith(`mcr.microsoft.com/playwright:v${expectedPlaywright}-noble@sha256:`)) {
            throw new Error("Update .github/workflows/ci.yml to match the pinned Playwright version");
          }
          console.log(`CI browser runtime: Node ${process.version}, Playwright ${expectedPlaywright}`);
          NODE
              phase() {
                local name="$1" start=$SECONDS
                shift
                "$@"
                printf "CI phase %s: %ss\n" "$name" "$((SECONDS - start))"
              }
              phase dependencies npm ci --workspace=apps/web --include-workspace-root=false --no-audit --no-fund
              phase build npm run build --workspace=apps/web
              phase browser npm run test:e2e --workspace=apps/web -- "$@"
            ' ci-browser "${options[@]}" &
          docker_pid=$!
          # A signal interrupts wait immediately, so cancellation can remove the container promptly.
          wait "$docker_pid"

      - name: Run quality check
        if: ${{ !matrix.browser }}
        run: ${{ matrix.command }}

  # Preserve the existing gate; failures, cancellations and skipped checks cannot pass it.
  check:
    if: ${{ always() }}
    needs: [validation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix check to pass
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$VALIDATION_RESULT" = success
