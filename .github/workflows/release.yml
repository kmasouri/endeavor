name: release

on:
  release:
    types: [published]

permissions:
  contents: read

# Finish one release before another changes the latest image or AWS deployment.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.release.outputs.image }}
      version: ${{ steps.release.outputs.version }}
      stable: ${{ steps.release.outputs.stable }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare image names
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tags must look like v1.2.0 or v1.2.0-rc.1' >&2
            exit 1
          fi
          stable=true
          if [[ "$PRERELEASE" == true || "$version" == *-* ]]; then stable=false; fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=sha-${{ steps.release.outputs.sha }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable == 'true' }}

      - name: Build and publish release image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image

  deploy-aws:
    needs: publish
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' && needs.publish.outputs.stable == 'true' }}
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}

    steps:
      - name: Check AWS configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          : "${AWS_ROLE_TO_ASSUME:?Set AWS_ROLE_TO_ASSUME in the sandbox environment}"
          : "${AWS_REGION:?Set AWS_REGION in the sandbox environment}"
          : "${ECR_REPOSITORY:?Set ECR_REPOSITORY in the sandbox environment}"
          : "${ECS_CLUSTER:?Set ECS_CLUSTER in the sandbox environment}"
          : "${ECS_SERVICE:?Set ECS_SERVICE in the sandbox environment}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install image copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Copy the published image to ECR
        env:
          SOURCE_IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
          DESTINATION_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
            "docker://$SOURCE_IMAGE" "docker://$DESTINATION_IMAGE:$VERSION"
          skopeo copy --all --preserve-digests --authfile "$HOME/.docker/config.json" \
            "docker://$SOURCE_IMAGE" "docker://$DESTINATION_IMAGE:latest"

      - name: Redeploy ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment
