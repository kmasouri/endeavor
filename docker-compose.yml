# Runs the whole platform on this computer: `npm run up`, then open http://localhost:3000.
# For development with `npm run dev`, start only Postgres: `npm run db:up`.
# Existing installations must migrate volumes first; see docs/rebranding.md.
name: endeavor

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: endeavor
      POSTGRES_PASSWORD: endeavor
      POSTGRES_DB: endeavor
    # DB_PORT in .env changes the port on this computer, if 5432 is taken.
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U endeavor -d endeavor']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    # Starts again after a crash or a reboot, once Docker is running. `npm run down` stops it.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # API keys and other settings come from .env, if it exists. The lines under `environment`
    # win, because inside Docker the database and folders are in different places.
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: docker
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://endeavor:endeavor@postgres:5432/endeavor
      WORKSPACES_DIR: /app/workspaces
    # Applies new apps/api/db/schema files, then starts the server.
    command: ['sh', '-c', 'node dist/migrate.js && exec node dist/index.js']
    # Only this computer can reach it: the API trusts x-actor-id until real sign-in exists.
    # APP_PORT in .env changes the port on this computer, if 3000 is taken.
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      - workspaces:/app/workspaces

  # The test API for pilot 2 (docs/pilot.md). Only starts with `npm run pilot:api`.
  pilot-api:
    image: node:26-alpine
    profiles: ['pilot']
    restart: unless-stopped
    working_dir: /app
    environment:
      PILOT_API_HOST: 0.0.0.0
      PILOT_API_STATE_FILE: /data/mock-api-state.json
    command: ['node', 'pilot/mock-api.ts']
    ports:
      - '127.0.0.1:4100:4100'
    volumes:
      - ./pilot:/app/pilot:ro
      - pilot-data:/data

volumes:
  pilot-data:
  postgres-data:
  workspaces:
