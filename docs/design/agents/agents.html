.version { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; padding: 18px 4px; border-top: 1px solid var(--border-100); align-items: start; }

.empty > p { max-width: 420px; margin: 10px auto 22px; color: var(--text-300); }
.examples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 640px; margin: 36px auto 0; text-align: left; }
.example { display: flex; gap: 12px; padding: 16px; border: 1px solid var(--border-100); border-radius: 12px; background: var(--bg-200); }
.example p { color: var(--text-300); font-size: 13px; margin-top: 2px; }

@media (max-width: 1100px) {
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: 36px minmax(0, 1fr) 150px 96px 14px; }

}
@media (max-width: 780px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .appbar { padding: 12px 16px; justify-content: space-between; }

  .search-launch { width: 40px; height: 40px; justify-content: center; padding: 0; }

  .kv { grid-template-columns: 1fr; gap: 2px; }

  .version { grid-template-columns: 1fr; gap: 6px; }
}

entColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M12 6v6l4 2\"><\/path><\/svg><span>Schedules<\/span><\/a>\n      <a href=\"Main.dc.html\" aria-current=\"page\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 8V4H8\"><\/path><rect width=\"16\" height=\"12\" x=\"4\" y=\"8\" rx=\"2\"><\/rect><path d=\"M2 14h2\"><\/path><path d=\"M20 14h2\"><\/path><path d=\"M15 13v2\"><\/path><path d=\"M9 13v2\"><\/path><\/svg><span>Agents<\/span><\/a>\n      <a href=\"#\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect width=\"7\" height=\"7\" x=\"3\" y=\"3\" rx=\"1\"><\/rect><rect width=\"7\" height=\"7\" x=\"14\" y=\"3\" rx=\"1\"><\/rect><rect width=\"7\" height=\"7\" x=\"14\" y=\"14\" rx=\"1\"><\/rect><rect width=\"7\" height=\"7\" x=\"3\" y=\"14\" rx=\"1\"><\/rect><\/svg><span>Skills and connections<\/span><\/a>\n      <a href=\"#\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6\"><\/path><\/svg><span>Setup<\/span><\/a>\n    <\/nav>\n    <div class=\"chats\">\n      <div class=\"recent-head\"><span class=\"section-label\">Recent<\/span><button type=\"button\" aria-label=\"New endeavor\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\/path><path d=\"M12 5v14\"><\/path><\/svg>New<\/button><\/div>\n      <a href=\"#\">Heat pump brief<\/a>\n      <a href=\"#\">Website reliability<\/a>\n      <a href=\"#\">Roman Empire research<\/a>\n      <a href=\"#\">Shipping and world trade<\/a>\n    <\/div>\n    <div class=\"profile\"><span class=\"avatar sm person\">K<\/span><div><strong>Kayvan Masouri<\/strong><small>Profile and settings<\/small><\/div><\/div>\n  <\/aside>\n\n  <main class=\"main\">\n    <div class=\"frame\">\n      <header class=\"header\">\n        <div>\n          <h1>Agents<\/h1>\n          <p class=\"subtitle\">Participants you configure to do work in endeavors. No agent is in charge of another.<\/p>\n        <\/div>\n        <a class=\"btn primary\" href=\"NewAgent.dc.html\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\/path><path d=\"M12 5v14\"><\/path><\/svg>New agent<\/a>\n      <\/header>\n\n      <div class=\"toolbar\">\n        <div class=\"filters\" role=\"group\" aria-label=\"Show\">\n          <sc-for list=\"{{filters}}\" as=\"f\" hint-placeholder-count=\"3\">\n            <button type=\"button\" aria-pressed=\"{{f.pressed}}\" onClick=\"{{f.pick}}\">{{f.label}}<\/button>\n          <\/sc-for>\n        <\/div>\n        <input class=\"search\" type=\"search\" aria-label=\"Search agents\" placeholder=\"Search agents\">\n      <\/div>\n\n      <div class=\"section-label list-label\">{{countLabel}}<\/div>\n      <div role=\"list\" aria-label=\"Agents\">\n        <sc-for list=\"{{rows}}\" as=\"item\" hint-placeholder-count=\"4\">\n          <a class=\"row {{item.rowClass}}\" href=\"AgentDetail.dc.html\" role=\"listitem\">\n            <span class=\"avatar {{item.tone}}\">\n              <sc-if value=\"{{item.isSearch}}\" hint-placeholder-val=\"{{true}}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\/circle><path d=\"m21 21-4.3-4.3\"><\/path><\/svg><\/sc-if>\n              <sc-if value=\"{{item.isCheck}}\" hint-placeholder-val=\"{{false}}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6 9 17l-5-5\"><\/path><\/svg><\/sc-if>\n              <sc-if value=\"{{item.isBot}}\" hint-placeholder-val=\"{{false}}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 8V4H8\"><\/path><rect width=\"16\" height=\"12\" x=\"4\" y=\"8\" rx=\"2\"><\/rect><path d=\"M15 13v2\"><\/path><path d=\"M9 13v2\"><\/path><\/svg><\/sc-if>\n            <\/span>\n            <div style=\"min-width: 0\">\n              <div class=\"row-title\"><h3>{{item.name}}<\/h3><span class=\"agent-label\">agent<\/span><\/div>\n              <p class=\"row-purpose\">{{item.purpose}}<\/p>\n            <\/div>\n            <div class=\"row-model\">{{item.model}}<small>{{item.version}}<\/small><\/div>\n            <div class=\"row-spend\">\n              <span>{{item.spend}} <small>{{item.budget}}<\/small><\/span>\n              <sc-if value=\"{{item.hasBudget}}\" hint-placeholder-val=\"{{true}}\"><div class=\"bar\" aria-hidden=\"true\"><span style=\"width: {{item.pct}}\"><\/span><\/div><\/sc-if>\n            <\/div>\n            <sc-if value=\"{{item.on}}\" hint-placeholder-val=\"{{true}}\"><span class=\"chip on\"><span class=\"dot\"><\/span>Enabled<\/span><\/sc-if>\n            <sc-if value=\"{{item.off}}\" hint-placeholder-val=\"{{false}}\"><span class=\"chip off\">Disabled<\/span><\/sc-if>\n            <sc-if value=\"{{item.warn}}\" hint-placeholder-val=\"{{false}}\"><span class=\"chip warn\">Needs setup<\/span><\/sc-if>\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"><\/path><\/svg>\n          <\/a>\n        <\/sc-for>\n      <\/div>\n      <p class=\"caption muted\" style=\"margin-top: 14px\">Spending is this month (UTC). Needs setup means the provider has no API key, so its tasks can’t run yet.<\/p>\n    <\/div>\n  <\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"theme\":{\"editor\":\"enum\",\"options\":[\"dark\",\"light\"],\"default\":\"dark\"},\"$preview\":{\"width\":1440,\"height\":1000}}'>\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { filter: 'all' }; }\n  renderVals() {\n    const agents = [\n      { name: 'Researcher', purpose: 'Researches topics and drafts briefs', tone: 'a2', icon: 'search', model: 'Anthropic · claude-sonnet-5-5', version: 'Version 4 · saved Oct 22', spend: '$3.12', budget: 'of $20.00', pct: '16%', status: 'on' },\n      { name: 'Reviewer', purpose: 'Checks claims and sources', tone: 'a1', icon: 'check', model: 'Anthropic · claude-haiku-5-5', version: 'Version 2 · saved Oct 19', spend: '$0.84', budget: 'no budget', pct: '0%', status: 'on' },\n      { name: 'Checker', purpose: 'Checks the test API and reports failures with steps to reproduce', tone: 'a3', icon: 'bot', model: 'OpenAI · [model name]', version: 'Version 1 · saved Oct 23', spend: '$0.00', budget: 'of $5.00', pct: '0%', status: 'warn' },\n      { name: 'QA', purpose: 'Tests the staging site and reports failures', tone: 'a0', icon: 'bot', model: 'Anthropic · claude-haiku-5-5', version: 'Version 3 · saved Oct 12', spend: '$0.00', budget: 'no budget', pct: '0%', status: 'off' }\n    ];\n    const f = this.state.filter;\n    const shown = agents.filter((a) => f === 'all' || (f === 'disabled' ? a.status === 'off' : a.status !== 'off'));\n    const filters = [['all', 'All'], ['enabled', 'Enabled'], ['disabled', 'Disabled']].map(([id, label]) => ({\n      label, pressed: String(f === id), pick: () => this.setState({ filter: id })\n    }));\n    return {\n      theme: this.props.theme ?? 'dark',\n      filters,\n      countLabel: 'Agents · ' + shown.length,\n      rows: shown.map((a) => ({\n        ...a,\n        isSearch: a.icon === 'search', isCheck: a.icon === 'check', isBot: a.icon === 'bot',\n        hasBudget: a.budget !== 'no budget',\n        on: a.status === 'on', off: a.status === 'off', warn: a.status === 'warn',\n        rowClass: a.status === 'off' ? 'disabled' : ''\n      }))\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n","NewAgent.dc.html":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>New agent<\/title>\n<script src=\"./support.js\"><\/script>\n<link rel=\"stylesheet\" href=\"agents.css\">\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0}\n<\/style>\n<\/helmet>\n<div class=\"app\" data-theme=\"{{theme}}\">\n  <header class=\"appbar\">\n    <div class=\"brand\"><span class=\"logo\">CA<\/span><span>Collaborative Agents<\/span><\/div>\n    <button type=\"button\" class=\"search-launch\" aria-label=\"Search endeavors\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\/circle><path d=\"m21 21-4.3-4.3\"><\/path><\/svg><span>Search endeavors…<\/span><span class=\"shortcut\">⌘ / Ctrl K<\/span><\/button>\n  <\/header>\n  <aside class=\"side\" aria-label=\"Application sidebar\">\n    <nav class=\"nav\" aria-label=\"Main\">\n      <a href=\"#\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"><\/rect><path d=\"M3 9h18\"><\/path><path d=\"M9 21V9\"><\/path><\/svg><span>Endeavors<\/span><\/a>\n      <a href=\"#\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"><\/path><path d=\"m9 12 2 2 4-4\"><\/path><\/svg><span>Approvals<\/span><\/a>\n      <a href=\"#\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M12 6v6l4 2\"><\/path><\/svg><span>Schedules<\/span><\/a>\n      <a href=\"Main.dc.html\" aria-current=\"page\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 8V4H8\"><\/path><rect width=\"16\" height=\"12\" x=\"4\" y=\"8\" rx=\"2\"><\/rect><path d=\"M2 14h2\"><\/path><path d=\"M20 14h2\"><\/path><path d=\"M15 13v2\"><\/path><path d=\"M9 13v2\"><\/path><\/svg><span>Agents<\/span><\/a>\n      <a href=\"#\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect width=\"7\" height=\"7\" x=\"3\" y=\"3\" rx=\"1\"><\/rect><rect width=\"7\" height=\"7\" x=\"14\" y=\"3\" rx=\"1\"><\/rect><rect width=\"7\" height=\"7\" x=\"14\" y=\"14\" rx=\"1\"><\/rect><rect width=\"7\" height=\"7\" x=\"3\" y=\"14\" rx=\"1\"><\/rect><\/svg><span>Skills and connections<\/span><\/a>\n      <a href=\"#\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6\"><\/path><\/svg><span>Setup<\/span><\/a>\n    <\/nav>\n    <div class=\"chats\">\n      <div class=\"recent-head\"><span class=\"section-label\">Recent<\/span><button type=\"button\" aria-label=\"New endeavor\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"><\/path><path d=\"M12 5v14\"><\/path><\/svg>New<\/button><\/div>\n      <a href=\"#\">Heat pump brief<\/a>\n      <a href=\"#\">Website reliability<\/a>\n    <\/div>\n    <div class=\"profile\"><span class=\"avatar sm person\">K<\/span><div><strong>Kayvan Masouri<\/strong><small>Profile and settings<\/small><\/div><\/div>\n  <\/aside>\n\n  <main class=\"main\">\n    <div class=\"frame\">\n      <a class=\"back\" href=\"Main.dc.html\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 19-7-7 7-7\"><\/path><path d=\"M19 12H5\"><\/path><\/svg>Agents<\/a>\n      <header class=\"header\">\n        <div>\n          <h1>New agent<\/h1>\n          <p class=\"subtitle\">Creating an agent saves version 1 of its configuration. You can change it later.<\/p>\n        <\/div>\n      <\/header>\n\n      <form class=\"form\">\n        <fieldset class=\"fieldset\">\n          <legend>About<\/legend>\n          <div class=\"pair\">\n            <label class=\"field\">Name<input class=\"input\" value=\"QA\" required><small>How people @mention it. Must be unique.<\/small><\/label>\n            <label class=\"field\">Purpose<input class=\"input\" value=\"Tests the staging site and reports failures\" required><small>One line other participants see.<\/small><\/label>\n          <\/div>\n        <\/fieldset>\n\n        <fieldset class=\"fieldset\">\n          <legend>Instructions<\/legend>\n          <label class=\"field\">How the agent should behave\n            <small>Its job, its limits, and its style. For example, “Investigate billing issues and cite your sources.”<\/small>\n            <textarea class=\"input\">Run the checkout tests. When one fails, ask Engineering to look into it, and include the steps and logs.<\/textarea>\n          <\/label>\n        <\/fieldset>\n\n        <fieldset class=\"fieldset\">\n          <legend>Model<\/legend>\n          <div class=\"pair\">\n            <label class=\"field\">Provider\n              <select class=\"input\"><option>Anthropic<\/option><option>OpenAI (not set up)<\/option><option>Scripted (for tests)<\/option><\/select>\n              <span class=\"ready\"><span class=\"dot\"><\/span>Ready. ANTHROPIC_API_KEY is set.<\/span>\n            <\/label>\n            <label class=\"field\">Model\n              <input class=\"input mono\" value=\"claude-haiku-5-5\" required>\n              <small>The provider’s model name, exactly as it spells it.<\/small>\n            <\/label>\n          <\/div>\n          <p class=\"hint\">Every model call goes over the internet to the provider, even when the app runs on this computer.<\/p>\n        <\/fieldset>\n\n        <fieldset class=\"fieldset\">\n          <legend>Skills <span class=\"muted meta\" style=\"font-weight: 400\">· optional<\/span><\/legend>\n          <dc-import name=\"Picker\" kind=\"skill\" chosen=\"review\" is-new=\"{{yes}}\" theme=\"{{theme}}\" hint-size=\"100%,160px\"><\/dc-import>\n        <\/fieldset>\n\n        <fieldset class=\"fieldset\">\n          <legend>Connections <span class=\"muted meta\" style=\"font-weight: 400\">· optional<\/span><\/legend>\n          <dc-import name=\"Picker\" kind=\"connection\" chosen=\"\" is-new=\"{{yes}}\" theme=\"{{theme}}\" hint-size=\"100%,140px\"><\/dc-import>\n        <\/fieldset>\n\n        <details class=\"fieldset\">\n          <summary style=\"cursor: pointer; font-size: 15px; font-weight: 600\">Limits per task <span class=\"muted meta\" style=\"font-weight: 400\">· defaults: $1.00 per task, no other limits<\/span><\/summary>\n          <div class=\"quad\" style=\"margin-top: 16px\">\n            <label class=\"field\">Model turns<input class=\"input\" inputmode=\"numeric\" placeholder=\"No limit\"><\/label>\n            <label class=\"field\">Tokens<input class=\"input\" inputmode=\"numeric\" placeholder=\"No limit\"><\/label>\n            <label class=\"field\">Cost, $<input class=\"input\" inputmode=\"decimal\" placeholder=\"1.00\"><\/label>\n            <label class=\"field\">Working minutes<input class=\"input\" inputmode=\"numeric\" placeholder=\"No limit\"><\/label>\n          <\/div>\n        <\/details>\n\n        <div class=\"savebar\">\n          <span class=\"meta muted\">After creating, add it to an endeavor and @mention it.<\/span>\n          <div style=\"display: flex; gap: 8px\">\n            <a class=\"btn secondary\" href=\"Main.dc.html\">Cancel<\/a>\n            <a class=\"btn primary\" href=\"AgentDetail.dc.html\">Create agent<\/a>\n          <\/div>\n        <\/div>\n      <\/form>\n    <\/div>\n  <\/main>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"theme\":{\"editor\":\"enum\",\"options\":[\"dark\",\"light\"],\"default\":\"dark\"},\"$preview\":{\"width\":1440,\"height\":1600}}'>\nclass Component extends DCLogic {\n  renderVals() {\n    return { theme: this.props.theme ?? 'dark', yes: true };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n","Picker.dc.html":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<title>Skill and connection picker<\/title>\n<script src=\"./support.js\"><\/script>\n<link rel=\"stylesheet\" href=\"agents.css\">\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<style>\nbody{margin:0}\n<\/style>\n<\/helmet>\n<div class=\"app picker\" data-theme=\"{{theme}}\" style=\"display: block; min-height: 0; background: var(--bg-100)\">\n  <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px\">\n    <span class=\"section-label\">{{chosenLabel}}<\/span>\n    <a class=\"link\" href=\"#\">{{browseLabel}}<\/a>\n  <\/div>\n\n  <sc-if value=\"{{hasChosen}}\" hint-placeholder-val=\"{{true}}\">\n    <ul class=\"picked\" aria-label=\"{{chosenLabel}}\">\n      <sc-for list=\"{{chosenItems}}\" as=\"item\" hint-placeholder-count=\"2\">\n        <li>\n          <span class=\"grow\">\n            <strong>{{item.name}}<\/strong>\n            <span class=\"muted caption\"> · {{item.desc}}<\/span>\n          <\/span>\n          <button type=\"button\" class=\"icon-btn\" aria-label=\"{{item.removeLabel}}\" onClick=\"{{item.remove}}\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 6 6 18\"><\/path><path d=\"m6 6 12 12\"><\/path><\/svg><\/button>\n        <\/li>\n      <\/sc-for>\n      <sc-for list=\"{{removedItems}}\" as=\"item\" hint-placeholder-count=\"0\">\n        <li class=\"removed\">\n          <span class=\"grow\">\n            <s>{{item.name}}<\/s>\n            <span class=\"caption\"> · {{removedNote}}<\/span>\n          <\/span>\n          <button type=\"button\" class=\"btn quiet\" style=\"min-height: 32px\" onClick=\"{{item.undo}}\">Undo<\/button>\n        <\/li>\n      <\/sc-for>\n    <\/ul>\n  <\/sc-if>\n  <sc-if value=\"{{noneChosen}}\" hint-placeholder-val=\"{{false}}\">\n    <p class=\"meta muted picked-empty\">{{noneLabel}}<\/p>\n  <\/sc-if>\n\n  <div class=\"combo\">\n    <label class=\"combo-input\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\/circle><path d=\"m21 21-4.3-4.3\"><\/path><\/svg>\n      <input type=\"search\" role=\"combobox\" aria-expanded=\"{{openStr}}\" aria-label=\"{{placeholder}}\" placeholder=\"{{placeholder}}\" value=\"{{query}}\" onInput=\"{{onQuery}}\" onFocus=\"{{onOpen}}\">\n    <\/label>\n    <sc-if value=\"{{open}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"results\" role=\"listbox\">\n        <sc-for list=\"{{matches}}\" as=\"m\" hint-placeholder-count=\"4\">\n          <button type=\"button\" role=\"option\" class=\"result\" onClick=\"{{m.add}}\">\n            <span class=\"grow\"><strong>{{m.name}}<\/strong><br><span class=\"muted caption\">{{m.desc}}<\/span><\/span>\n            <span class=\"caption muted\">{{m.meta}}<\/span>\n            <span class=\"add\">Add<\/span>\n          <\/button>\n        <\/sc-for>\n        <sc-if value=\"{{noMatches}}\" hint-placeholder-val=\"{{false}}\"><p class=\"meta muted\" style=\"padding: 12px\">{{noMatchLabel}}<\/p><\/sc-if>\n        <div class=\"results-foot\">\n          <span class=\"caption muted\">{{footLabel}}<\/span>\n          <button type=\"button\" class=\"btn quiet\" style=\"min-height: 0; padding: 4px 8px\" onClick=\"{{onClose}}\">Done<\/button>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n  <\/div>\n  <p class=\"hint\" style=\"margin-top: 8px\">{{hint}}<\/p>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"kind\":{\"editor\":\"enum\",\"options\":[\"skill\",\"connection\"],\"default\":\"skill\"},\"chosen\":{\"editor\":\"text\",\"default\":\"cite,plain\"},\"isNew\":{\"editor\":\"boolean\",\"default\":false},\"theme\":{\"editor\":\"enum\",\"options\":[\"dark\",\"light\"],\"default\":\"dark\"},\"$preview\":{\"width\":820,\"height\":560}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const start = (props.chosen ?? 'cite,plain').split(',').map((s) => s.trim()).filter(Boolean);\n    this.state = { chosen: start, removed: [], query: '', open: false };\n  }\n  catalog(kind) {\n    if (kind === 'connection') return {\n      total: 38,\n      items: [\n        { id: 'web', name: 'Web search', desc: 'Search the public web', access: true, meta: 'Used by 4 agents' },\n        { id: 'test', name: 'Test API', desc: 'Staging checkout endpoints', access: false, meta: 'Used by 2 agents' },\n        { id: 'github', name: 'GitHub', desc: 'Read issues and pull requests', access: false, meta: 'Used by 3 agents' },\n        { id: 'linear', name: 'Linear', desc: 'Create and update tickets', access: false, meta: 'Used by 1 agent' },\n        { id: 'slack', name: 'Slack', desc: 'Post to chosen channels', access: false, meta: 'Used by 2 agents' },\n        { id: 'drive', name: 'Google Drive', desc: 'Read shared folders', access: false, meta: 'Not used yet' },\n        { id: 'stripe', name: 'Stripe (test mode)', desc: 'Look up test payments', access: false, meta: 'Used by 1 agent' },\n        { id: 'pg', name: 'Reporting database', desc: 'Read-only SQL', access: false, meta: 'Used by 2 agents' }\n      ]\n    };\n    return {\n      total: 214,\n      items: [\n        { id: 'cite', name: 'Cite sources', desc: 'Link a source after every claim', meta: 'Version 3' },\n        { id: 'plain', name: 'Plain-language briefs', desc: 'Short sentences, everyday words', meta: 'Version 2' },\n        { id: 'review', name: 'Review checklist', desc: 'Check claims against their sources', meta: 'Version 5' },\n        { id: 'release', name: 'Release notes', desc: 'Summarize changes for readers', meta: 'Version 1' },\n        { id: 'meetings', name: 'Meeting summaries', desc: 'Decisions, owners, and dates', meta: 'Version 2' },\n        { id: 'a11y', name: 'Accessibility review', desc: 'Check pages against WCAG basics', meta: 'Version 4' },\n        { id: 'sql', name: 'Careful SQL', desc: 'Read-only queries with limits', meta: 'Version 1' },\n        { id: 'spanish', name: 'Translate to Spanish', desc: 'Keep names and numbers as written', meta: 'Version 1' },\n        { id: 'testplan', name: 'Test plans', desc: 'Steps, expected results, and risks', meta: 'Version 3' },\n        { id: 'security', name: 'Security review', desc: 'Flag secrets and unsafe input', meta: 'Version 2' }\n      ]\n    };\n  }\n  renderVals() {\n    const kind = this.props.kind ?? 'skill';\n    const isConn = kind === 'connection';\n    const { total, items } = this.catalog(kind);\n    const { chosen, removed, query, open } = this.state;\n    const q = query.trim().toLowerCase();\n    const pool = items.filter((i) => !chosen.includes(i.id) && !removed.includes(i.id));\n    const found = pool.filter((i) => !q || (i.name + ' ' + i.desc).toLowerCase().includes(q));\n    const noun = isConn ? 'connection' : 'skill';\n    const nouns = noun + 's';\n    return {\n      theme: this.props.theme ?? 'dark',\n      chosenLabel: 'Chosen ' + nouns + ' · ' + chosen.length,\n      browseLabel: 'Browse ' + nouns,\n      hasChosen: chosen.length + removed.length > 0,\n      noneChosen: chosen.length + removed.length === 0,\n      noneLabel: 'No ' + nouns + ' yet.',\n      chosenItems: chosen.map((id) => items.find((i) => i.id === id)).filter(Boolean).map((i) => ({\n        ...i,\n        removeLabel: 'Remove ' + i.name,\n        remove: () => this.setState({ chosen: chosen.filter((c) => c !== i.id), removed: this.props.isNew ? removed : [...removed, i.id] })\n      })),\n      removedItems: removed.map((id) => items.find((i) => i.id === id)).filter(Boolean).map((i) => ({\n        ...i,\n        undo: () => this.setState({ removed: removed.filter((r) => r !== i.id), chosen: [...chosen, i.id] })\n      })),\n      removedNote: 'When you save, open tasks stop using it too',\n      placeholder: 'Add a ' + noun + '…',\n      query,\n      open,\n      openStr: String(open),\n      onQuery: (e) => this.setState({ query: e.target.value, open: true }),\n      onOpen: () => this.setState({ open: true }),\n      onClose: () => this.setState({ open: false, query: '' }),\n      matches: found.slice(0, 5).map((i) => ({ ...i, add: () => this.setState({ chosen: [...chosen, i.id], query: '' }) })),\n      noMatches: found.length === 0,\n      noMatchLabel: 'No ' + nouns + ' match “' + query + '”.',\n      footLabel: q\n        ? found.length + ' match' + (found.length === 1 ? '' : 'es') + (found.length > 5 ? ' · showing 5, keep typing to narrow' : '')\n        : (total - chosen.length) + ' more ' + nouns + ' · type to search',\n      hint: isConn\n        ? 'Outside APIs the agent may call. Chosen means allowed; some calls still ask for your OK.'\n        : 'Reusable instructions the agent follows. Skills never add connections.'\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n"};</script>
<script>// Minimal local renderer for .dc.html artboards, used only to screenshot and export them.
(function () {
  const override = Object.fromEntries(new URLSearchParams(location.search));

  class DCLogic {
    constructor(props) { this.props = props; this.state = {}; }
    setState(patch) { Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch); this.__render(); }
    forceUpdate() { this.__render(); }
  }
  window.DCLogic = DCLogic;

  let suppress = false;
  const HOLE =/\{\{\s*([^}]+?)\s*\}\}/g;
  const WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;

  function lookup(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    const parts = path.split('.');
    let v = scope;
    for (const p of parts) { if (v == null) return undefined; v = v[p]; }
    return v;
  }

  function load(name) {
    // The standalone preview embeds every artboard, so it opens straight from disk.
    if (window.__DC_FILES) return new DOMParser().parseFromString(window.__DC_FILES[name + '.dc.html'], 'text/html');
    const xhr = new XMLHttpRequest();
    xhr.open('GET', name + '.dc.html', false);
    xhr.send();
    return new DOMParser().parseFromString(xhr.responseText, 'text/html');
  }

  function camel(s) { return s.replace(/-([a-z])/g, (_, c) => c.toUpperCase()); }

  function mount(doc, host, passed) {
    const xdc = doc.querySelector('x-dc');
    const script = doc.querySelector('script[data-dc-script]');
    const decl = JSON.parse(script.getAttribute('data-props') || '{}');
    const props = {};
    for (const [k, d] of Object.entries(decl)) if (!k.startsWith('$') && d && 'default' in d) props[k] = d.default;
    Object.assign(props, passed);
    const helmet = xdc.querySelector('helmet');
    if (helmet) { for (const s of helmet.querySelectorAll('style')) document.head.appendChild(s.cloneNode(true)); helmet.remove(); }
    const Component = new Function('DCLogic', script.textContent + '\n;return Component;')(DCLogic);
    const inst = new Component(props);
    inst.state = inst.state || {};
    inst.__render = () => {
      const vals = inst.renderVals();
      // Keep focus on a redrawn field so typing keeps working.
      const active = document.activeElement;
      const key = active && host.contains(active) ? active.getAttribute('aria-label') : null;
      host.replaceChildren(...[...xdc.childNodes].flatMap((n) => process(n, vals)));
      if (key) {
        const next = host.querySelector(`[aria-label="${CSS.escape(key)}"]`);
        if (next) {
          suppress = true;
          next.focus();
          if (typeof next.value === 'string' && next.setSelectionRange) next.setSelectionRange(next.value.length, next.value.length);
          suppress = false;
        }
      }
    };
    inst.__render();
  }

  function process(node, scope) {
    if (node.nodeType === Node.TEXT_NODE) {
      return [document.createTextNode(node.textContent.replace(HOLE, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); }))];
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return [];
    const tag = node.tagName.toLowerCase();
    const raw = (name) => { const m = (node.getAttribute(name) || '').match(WHOLE); return m ? lookup(m[1], scope) : node.getAttribute(name); };
    if (tag === 'sc-for') {
      const list = raw('list') || [];
      const as = node.getAttribute('as') || 'item';
      return list.flatMap((item, i) => [...node.childNodes].flatMap((c) => process(c, Object.assign(Object.create(scope), { [as]: item, $index: i }))));
    }
    if (tag === 'sc-if') return raw('value') ? [...node.childNodes].flatMap((c) => process(c, scope)) : [];
    if (tag === 'dc-import') {
      const passed = {};
      for (const a of node.attributes) if (a.name !== 'name' && !a.name.startsWith('hint-')) passed[camel(a.name)] = raw(a.name);
      const host = document.createElement('div');
      mount(load(node.getAttribute('name')), host, passed);
      return [host];
    }
    const el = node.cloneNode(false);
    for (const a of [...node.attributes]) {
      if (!a.value.includes('{{')) continue;
      const m = a.value.match(WHOLE);
      const v = m ? lookup(m[1], scope) : a.value.replace(HOLE, (_, p) => String(lookup(p, scope) ?? ''));
      if (/^on[A-Z]/.test(a.name) || /^on[a-z]+$/.test(a.name) && typeof v === 'function') {
        el.removeAttribute(a.name);
        if (typeof v === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), (e) => { if (!suppress) v(e); });
      } else if (a.name === 'value') { el.removeAttribute('value'); el.value = v ?? ''; el.setAttribute('value', v ?? ''); }
      else el.setAttribute(a.name, v == null ? '' : String(v));
    }
    for (const c of node.childNodes) el.append(...process(c, scope));
    return [el];
  }

  document.addEventListener('DOMContentLoaded', () => {
    if (window.__DC_FILES) {
      const { screen = 'Main', ...rest } = override;
      mount(load(screen), document.getElementById('dc-root'), rest);
      document.documentElement.dataset.rendered = 'true';
      return;
    }
    const xdc = document.querySelector('x-dc');
    const host = document.createElement('div');
    host.id = 'dc-root';
    xdc.replaceWith(host);
    const doc = document.implementation.createHTMLDocument('');
    doc.body.append(xdc, document.querySelector('script[data-dc-script]'));
    mount(doc, host, override);
    document.documentElement.dataset.rendered = 'true';
  });
})();
</script>
</head>
<body>
<form id="review" aria-label="Review controls, not part of the design">
  <label>Screen <select name="screen"><option value="Main">Agents · with agents</option><option value="AgentsEmpty">Agents · empty</option><option value="AgentsLight">Agents · light</option><option value="AgentsMobile">Agents · phone</option><option value="AgentDetail">Agent · Overview</option><option value="AgentConfig">Agent · Configuration</option><option value="AgentVersions">Agent · Versions</option><option value="NewAgent">New agent</option><option value="Picker">Skill and connection picker</option></select></label>
  <label>Appearance <select name="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label>
</form>
<div id="dc-root"></div>
<script>
  const params = new URLSearchParams(location.search);
  const review = document.getElementById('review');
  if (params.get('bare')) review.hidden = true;
  for (const s of review.querySelectorAll('select')) {
    if (params.get(s.name)) s.value = params.get(s.name);
    s.onchange = () => { params.set(s.name, s.value); location.search = params; };
  }
</script>
