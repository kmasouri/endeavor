<!-- Static export of the approved option A from the claude.ai design canvas. Set data-theme="light" on .sb for the light theme. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project sidebar — approved CA-122 design</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#141517}
.sb{--bg-000:#141517;--bg-100:#1a1b1e;--bg-150:#17181b;--bg-200:#1f2023;--bg-selected:#2b2d33;--border-100:#26282c;--border-200:#3a3d43;--text-100:#e8e9eb;--text-200:#c9ccd1;--text-300:#9a9da3;--accent:#f59e0b;--accent-ink:#2a1600;--notify:#d93036;--notify-ink:#fff;--person-1-bg:#1e2a44;--person-1-ink:#a5b4fc}
.sb[data-theme=light]{--bg-000:#f3f4f6;--bg-100:#fff;--bg-150:#f7f8fa;--bg-200:#f7f8fa;--bg-selected:#e9eaee;--border-100:#e4e6ea;--border-200:#c2c7cf;--text-100:#16181c;--text-200:#3d4148;--text-300:#5f646c;--accent:#e08e00;--notify:#dc2626;--person-1-bg:#e0e7ff;--person-1-ink:#3730a3}
.sb{position:relative;width:300px;height:800px;box-sizing:border-box;background:var(--bg-150);color:var(--text-200);font:14px/20px Inter,system-ui,sans-serif;display:flex;flex-direction:column;border-right:1px solid var(--border-100);overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;height:56px;flex:none;padding:0 14px;border-bottom:1px solid var(--border-100);color:var(--text-100);font-weight:600;font-size:15px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.ib{width:26px;height:26px;display:grid;place-items:center;border:0;background:none;color:var(--text-300);border-radius:6px;padding:0;cursor:pointer;flex:none}
.ib:hover{background:var(--bg-selected);color:var(--text-100)}
.main{flex:1;min-height:0;padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.item{display:flex;align-items:center;gap:10px;height:32px;flex:none;padding:0 10px;border-radius:8px;color:var(--text-200);text-decoration:none}
.item:hover{background:var(--bg-200)}
.item svg{flex:none;color:var(--text-300)}
.item.active{background:var(--bg-selected);color:var(--text-100);font-weight:600}
.item.unread{color:var(--text-100);font-weight:600}
.badge{margin-left:auto;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--notify);color:var(--notify-ink);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.sec{display:flex;align-items:center;justify-content:space-between;height:28px;flex:none;padding:0 4px 0 10px;margin-top:14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-300)}
.pg{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;color:var(--pc);background:color-mix(in srgb,var(--pc) 18%,transparent)}
.sb[data-theme=light] .pg{color:color-mix(in srgb,var(--pc) 55%,#16181c)}
.item .pg svg{color:inherit}
.kids{margin-left:20px;padding-left:10px;border-left:1px solid var(--border-200);display:flex;flex-direction:column;gap:1px;flex:none}
.kids .item{height:30px;padding:0 8px}
.foot{border-top:1px solid var(--border-100);padding:12px 14px;display:flex;align-items:center;gap:10px;flex:none}
.av{width:28px;height:28px;border-radius:8px;background:var(--person-1-bg);color:var(--person-1-ink);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.cap{font-size:12px;color:var(--text-300)}
</style>
</head>
<body>
<div class="sb" data-theme="dark">
  <div class="brand"><button class="ib" type="button" aria-label="Collapse sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button><span class="mark">E</span>Endeavor</div>
  <div class="main">
    <a class="item" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>New endeavor</a>
    <a class="item" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span class="ell">Approvals</span><span class="badge">2</span></a>
    <a class="item" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="ell">Schedules</span></a>
    <a class="item" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M9 14h.01M15 14h.01"/></svg><span class="ell">Agents</span></a>
    <a class="item" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M17.5 14v7M14 17.5h7"/></svg><span class="ell">Plugins</span></a>
    <a class="item" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg><span class="ell">Skills</span></a>
    <a class="item" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span class="ell">Connections</span></a>
    <a class="item" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg><span class="ell">Setup</span></a>

    <div class="sec"><span>Projects</span><button class="ib" type="button" aria-label="New project"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>

    <button class="item" type="button" aria-expanded="true" style="border: 0; background: none; font: inherit; width: 100%; text-align: left; cursor: pointer"><span class="pg" style="--pc: #8797ae"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span><span class="ell" style="color: var(--text-100); font-weight: 500">General</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="kids">
      <a class="item active" href="#" aria-current="page"><span class="ell">Scheduled API check</span></a>
      <a class="item unread" href="#"><span class="ell">Website reliability</span><span class="badge">3</span></a>
    </div>

    <button class="item" type="button" aria-expanded="false" style="border: 0; background: none; font: inherit; width: 100%; text-align: left; cursor: pointer"><span class="pg" style="--pc: #28b8ae"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/></svg></span><span class="ell" style="color: var(--text-100); font-weight: 500">Pilots</span><span class="badge" style="margin-left: 0">1</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>

    <button class="item" type="button" aria-expanded="true" style="border: 0; background: none; font: inherit; width: 100%; text-align: left; cursor: pointer"><span class="pg" style="--pc: #ad7bf9"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span><span class="ell" style="color: var(--text-100); font-weight: 500">Q3 reporting</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="kids">
      <a class="item" href="#"><span class="ell">Q3 completeness review</span></a>
    </div>

    <div class="sec"><span>No project</span></div>
    <a class="item" href="#"><span class="ell">Vaccine explainer</span></a>
    <a class="item" href="#"><span class="ell">Roman Empire research</span></a>
  </div>
  <div class="foot"><span class="av">K</span><span style="display: flex; flex-direction: column; min-width: 0"><strong style="color: var(--text-100); font-weight: 600">Kayvan</strong><span class="cap">Profile and settings</span></span></div>
</div>
</body>
</html>
