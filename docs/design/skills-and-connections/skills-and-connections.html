<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skills and connections</title>
    <!-- Agreed design mockup from the Codex design review on 2026-10-24. Not app code. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style-guide/tokens.css" />
    <style>
      body {
        margin: 0;
        background: var(--bg-100);
      }
      .cursor-interaction {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <script>
      // Inline Lucide icons keep this design reference usable without a library or host runtime.
      const designIcons = {
        'arrow-left':
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-left" aria-hidden="true" class="lucide lucide-arrow-left"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>',
        blocks:
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="blocks" aria-hidden="true" class="lucide lucide-blocks"><path d="M10 22V7a1 1 0 0 0-1-1H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5a1 1 0 0 0-1-1H2"></path><rect x="14" y="2" width="8" height="8" rx="1"></rect></svg>',
        bot: '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="bot" aria-hidden="true" class="lucide lucide-bot"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg>',
        'chevron-right':
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="chevron-right" aria-hidden="true" class="lucide lucide-chevron-right"><path d="m9 18 6-6-6-6"></path></svg>',
        'circle-check':
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="circle-check" aria-hidden="true" class="lucide lucide-circle-check"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>',
        'circle-pause':
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="circle-pause" aria-hidden="true" class="lucide lucide-circle-pause"><circle cx="12" cy="12" r="10"></circle><line x1="10" x2="10" y1="15" y2="9"></line><line x1="14" x2="14" y1="15" y2="9"></line></svg>',
        'circle-x':
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="circle-x" aria-hidden="true" class="lucide lucide-circle-x"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg>',
        clock:
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="clock" aria-hidden="true" class="lucide lucide-clock"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>',
        'file-text':
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="file-text" aria-hidden="true" class="lucide lucide-file-text"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>',
        info: '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="info" aria-hidden="true" class="lucide lucide-info"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>',
        'key-round':
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="key-round" aria-hidden="true" class="lucide lucide-key-round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"></path><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>',
        'message-square':
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="message-square" aria-hidden="true" class="lucide lucide-message-square"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"></path></svg>',
        pause:
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="pause" aria-hidden="true" class="lucide lucide-pause"><rect x="14" y="3" width="5" height="18" rx="1"></rect><rect x="5" y="3" width="5" height="18" rx="1"></rect></svg>',
        plug: '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plug" aria-hidden="true" class="lucide lucide-plug"><path d="M12 22v-5"></path><path d="M15 8V2"></path><path d="M17 8a1 1 0 0 1 1 1v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1z"></path><path d="M9 8V2"></path></svg>',
        plus: '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus" aria-hidden="true" class="lucide lucide-plus"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>',
        search:
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="search" aria-hidden="true" class="lucide lucide-search"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>',
        settings:
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="settings" aria-hidden="true" class="lucide lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"></path><circle cx="12" cy="12" r="3"></circle></svg>',
        'shield-check':
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="shield-check" aria-hidden="true" class="lucide lucide-shield-check"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>',
        'square-check':
          '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="square-check" aria-hidden="true" class="lucide lucide-square-check"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="m9 12 2 2 4-4"></path></svg>',
        x: '<svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="x" aria-hidden="true" class="lucide lucide-x"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>'
      };
      const lucide = {
        createIcons({ root = document } = {}) {
          root.querySelectorAll('[data-lucide]').forEach((element) => {
            const source = designIcons[element.dataset.lucide];
            if (!source) return;
            const template = document.createElement('template');
            template.innerHTML = source;
            element.replaceWith(template.content.firstElementChild);
          });
        }
      };
    </script>
    <style>
      #ca-tabbed-catalog {
        --ca-ground: var(--bg-100);
        --ca-side: var(--bg-000);
        --ca-raised: var(--bg-200);
        --ca-selected: var(--bg-selected);
        --ca-line: var(--border-100);
        --ca-control: var(--border-200);
        --ca-ink: var(--text-100);
        --ca-secondary: var(--text-200);
        --ca-quiet: var(--text-300);
        --ca-yolk: var(--accent);
        --ca-yolk-ink: var(--accent-ink);
        font:
          14px/1.5 Inter,
          system-ui,
          sans-serif;
        color: var(--ca-ink);
      }
      #ca-tabbed-catalog * {
        box-sizing: border-box;
      }
      #ca-tabbed-catalog .ca-app {
        display: grid;
        grid-template-columns: 192px minmax(0, 1fr);
        min-height: 860px;
        background: var(--ca-ground);
      }
      #ca-tabbed-catalog .ca-sidebar {
        background: var(--ca-side);
        border-right: 1px solid var(--ca-line);
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-width: 0;
      }
      #ca-tabbed-catalog .ca-brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
        padding: 0 6px;
      }
      #ca-tabbed-catalog .ca-logo {
        background: var(--ca-yolk);
        color: var(--ca-yolk-ink);
        border-radius: 8px;
        padding: 7px 5px;
        font-weight: 700;
      }
      #ca-tabbed-catalog .ca-nav {
        display: grid;
        gap: 4px;
      }
      #ca-tabbed-catalog .ca-nav span {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        color: var(--ca-secondary);
        border-radius: 7px;
        font-size: 13px;
      }
      #ca-tabbed-catalog .ca-nav span.ca-active {
        background: var(--ca-selected);
        color: var(--ca-ink);
      }
      #ca-tabbed-catalog svg {
        width: 17px;
        height: 17px;
        flex-shrink: 0;
      }
      #ca-tabbed-catalog .ca-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--ca-quiet);
        font-weight: 600;
      }
      #ca-tabbed-catalog .ca-conversations {
        display: grid;
        gap: 12px;
        padding: 0 10px;
        font-size: 12px;
        color: var(--ca-quiet);
      }
      #ca-tabbed-catalog .ca-conversations > span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #ca-tabbed-catalog .ca-person {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 16px 6px 0;
        border-top: 1px solid var(--ca-line);
        font-size: 12px;
      }
      #ca-tabbed-catalog .ca-avatar {
        background: var(--person-1-bg);
        color: var(--person-1-ink);
        border-radius: 8px;
        padding: 7px 11px;
      }
      #ca-tabbed-catalog .ca-main {
        min-width: 0;
      }
      #ca-tabbed-catalog .ca-top {
        padding: 18px 28px;
        border-bottom: 1px solid var(--ca-line);
        font-size: 12px;
        color: var(--ca-quiet);
      }
      #ca-tabbed-catalog .ca-page {
        padding: 30px 28px;
      }
      #ca-tabbed-catalog h1 {
        font-size: 24px;
        line-height: 1.25;
        letter-spacing: -0.6px;
        margin: 0 0 10px;
        font-weight: 600;
      }
      #ca-tabbed-catalog h2 {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.4;
        margin: 0;
      }
      #ca-tabbed-catalog h3 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      #ca-tabbed-catalog p {
        margin: 6px 0 0;
      }
      #ca-tabbed-catalog .ca-muted {
        color: var(--ca-quiet);
        font-size: 12px;
      }
      #ca-tabbed-catalog .ca-intro {
        color: var(--ca-secondary);
        max-width: 570px;
        font-size: 13px;
      }
      #ca-tabbed-catalog .ca-note {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 22px 0 28px;
        color: var(--ca-quiet);
        font-size: 12px;
      }
      #ca-tabbed-catalog .ca-note svg {
        margin-top: 1px;
        width: 14px;
        height: 14px;
      }
      #ca-tabbed-catalog button {
        font: inherit;
        color: inherit;
        cursor: inherit;
      }
      #ca-tabbed-catalog .ca-button {
        min-height: 36px;
        border: 1px solid var(--ca-control);
        border-radius: 7px;
        padding: 7px 12px;
        background: transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
      }
      #ca-tabbed-catalog .ca-button:hover {
        background: var(--ca-selected);
      }
      #ca-tabbed-catalog .ca-primary {
        border-color: var(--ca-yolk);
        background: var(--ca-yolk);
        color: var(--ca-yolk-ink);
      }
      #ca-tabbed-catalog .ca-primary:hover {
        background: var(--ca-yolk);
        filter: brightness(1.06);
      }
      #ca-tabbed-catalog .ca-tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid var(--ca-line);
        margin-bottom: 24px;
      }
      #ca-tabbed-catalog .ca-tab {
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 10px 0;
        color: var(--ca-quiet);
        font-size: 13px;
      }
      #ca-tabbed-catalog .ca-tab[aria-pressed='true'] {
        color: var(--ca-ink);
        border-bottom-color: var(--ca-yolk);
      }
      #ca-tabbed-catalog .ca-number {
        font-size: 11px;
        margin-left: 5px;
        color: var(--ca-quiet);
      }
      #ca-tabbed-catalog .ca-sectionhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      #ca-tabbed-catalog .ca-list {
        border-top: 1px solid var(--ca-line);
      }
      #ca-tabbed-catalog .ca-row {
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 13px;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--ca-line);
        padding: 19px 4px;
      }
      #ca-tabbed-catalog .ca-row:hover,
      #ca-tabbed-catalog .ca-row[aria-pressed='true'] {
        background: var(--ca-raised);
      }
      #ca-tabbed-catalog .ca-itemicon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border: 1px solid var(--ca-control);
        border-radius: 8px;
        color: var(--ca-quiet);
        flex-shrink: 0;
      }
      #ca-tabbed-catalog .ca-copy {
        min-width: 0;
        flex: 1;
      }
      #ca-tabbed-catalog .ca-name {
        font-size: 13px;
        font-weight: 600;
        display: block;
      }
      #ca-tabbed-catalog .ca-description {
        color: var(--ca-quiet);
        font-size: 12px;
        display: block;
        margin-top: 3px;
      }
      #ca-tabbed-catalog .ca-rowmeta {
        font-size: 11px;
        color: var(--ca-quiet);
        display: block;
        margin-top: 6px;
      }
      #ca-tabbed-catalog .ca-chevron {
        color: var(--ca-quiet);
      }
      #ca-tabbed-catalog .ca-detail {
        padding-left: 24px;
        border-left: 1px solid var(--ca-line);
        min-width: 0;
      }
      #ca-tabbed-catalog .ca-detailtop {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 24px;
      }
      #ca-tabbed-catalog .ca-detailtop h2 {
        margin-top: 5px;
      }
      #ca-tabbed-catalog .ca-detailbody {
        display: grid;
        gap: 20px;
      }
      #ca-tabbed-catalog .ca-field {
        display: grid;
        gap: 7px;
        color: var(--ca-secondary);
        font-size: 12px;
      }
      #ca-tabbed-catalog input:not([type='checkbox']),
      #ca-tabbed-catalog textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--ca-control);
        border-radius: 7px;
        background: var(--ca-ground);
        color: var(--ca-ink);
        padding: 10px 11px;
        font:
          13px/1.6 Inter,
          system-ui,
          sans-serif;
      }
      #ca-tabbed-catalog textarea {
        min-height: 170px;
        resize: vertical;
      }
      #ca-tabbed-catalog .ca-checks {
        display: grid;
        gap: 8px;
        font-size: 12px;
      }
      #ca-tabbed-catalog .ca-checks label {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #ca-tabbed-catalog input[type='checkbox'] {
        accent-color: var(--ca-yolk);
      }
      #ca-tabbed-catalog .ca-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        padding-top: 14px;
        border-top: 1px solid var(--ca-line);
      }
      #ca-tabbed-catalog .ca-security {
        background: var(--ca-raised);
        padding: 14px;
        border-radius: 8px;
        font-size: 12px;
        color: var(--ca-secondary);
      }
      #ca-tabbed-catalog .ca-keyvalue {
        display: grid;
        gap: 6px;
      }
      #ca-tabbed-catalog code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        overflow-wrap: anywhere;
        color: var(--ca-secondary);
      }
      #ca-tabbed-catalog .ca-message {
        margin-top: 14px;
        color: var(--ca-quiet);
        font-size: 12px;
        min-height: 18px;
      }
      @media (min-width: 1250px) {
        #ca-tabbed-catalog .ca-app {
          grid-template-columns: 225px minmax(0, 1fr);
        }
        #ca-tabbed-catalog .ca-page {
          padding: 36px 40px;
        }
      }
      @media (max-width: 780px) {
        #ca-tabbed-catalog .ca-app {
          grid-template-columns: 160px minmax(0, 1fr);
        }
        #ca-tabbed-catalog .ca-page {
          padding: 24px 18px;
        }
        #ca-tabbed-catalog .ca-top {
          padding: 18px;
        }
        #ca-tabbed-catalog .ca-shelves {
          grid-template-columns: 1fr;
          gap: 28px;
        }
        #ca-tabbed-catalog .ca-shelves > section + section {
          padding-left: 0;
          border-left: 0;
        }
        #ca-tabbed-catalog .ca-content.ca-detail-open {
          grid-template-columns: 1fr;
        }
        #ca-tabbed-catalog .ca-detail {
          border-left: 0;
          border-top: 1px solid var(--ca-line);
          padding: 24px 0 0;
        }
        #ca-tabbed-catalog .ca-inline-detail .ca-detailbody {
          grid-template-columns: 1fr;
        }
        #ca-tabbed-catalog .ca-app {
          min-height: 1150px;
        }
      }
      @media (max-width: 540px) {
        #ca-tabbed-catalog .ca-app {
          grid-template-columns: minmax(0, 1fr);
          min-height: 1340px;
        }
        #ca-tabbed-catalog .ca-sidebar {
          padding: 12px 16px;
          border-right: 0;
          border-bottom: 1px solid var(--ca-line);
          gap: 12px;
        }
        #ca-tabbed-catalog .ca-nav {
          display: flex;
          flex-wrap: wrap;
          gap: 0;
        }
        #ca-tabbed-catalog .ca-nav span {
          padding: 6px 8px;
          font-size: 11px;
        }
        #ca-tabbed-catalog .ca-nav svg {
          display: none;
        }
        #ca-tabbed-catalog .ca-conversations,
        #ca-tabbed-catalog .ca-person {
          display: none;
        }
        #ca-tabbed-catalog .ca-top {
          padding: 12px 18px;
        }
        #ca-tabbed-catalog .ca-sectionhead {
          align-items: flex-start;
        }
        #ca-tabbed-catalog h1 {
          font-size: 22px;
        }
        #ca-tabbed-catalog input:not([type='checkbox']),
        #ca-tabbed-catalog textarea {
          font-size: 16px;
        }
      }
      @media (pointer: coarse) {
        #ca-tabbed-catalog button {
          min-height: 44px;
        }
      }

      #ca-tabbed-catalog .ca-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
        flex-shrink: 0;
      }
      #ca-tabbed-catalog .ca-status svg {
        width: 14px;
        height: 14px;
      }
      #ca-tabbed-catalog .ca-status-enabled {
        background: var(--success-bg);
        color: var(--success);
      }
      #ca-tabbed-catalog .ca-status-disabled {
        background: var(--ca-selected);
        border: 1px solid var(--ca-control);
        color: var(--ca-ink);
      }
      #ca-tabbed-catalog .ca-editor-open .ca-detail {
        border: 0;
        padding: 0;
      }
      #ca-tabbed-catalog .ca-back {
        margin-bottom: 24px;
      }
      #ca-tabbed-catalog .ca-detailtop {
        align-items: center;
      }
      #ca-tabbed-catalog .ca-detailtop h2 {
        font-size: 20px;
      }
      #ca-tabbed-catalog .ca-editor-open textarea[name='instructions'] {
        min-height: 360px;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 13px;
        line-height: 1.8;
        padding: 18px;
        tab-size: 2;
      }
      #ca-tabbed-catalog .ca-editor-open .ca-field {
        font-size: 13px;
        font-weight: 500;
      }
      #ca-tabbed-catalog .ca-editor-open .ca-checks {
        gap: 0;
      }
      #ca-tabbed-catalog .ca-editor-open .ca-checks label {
        align-items: flex-start;
        padding: 14px 0;
        border-bottom: 1px solid var(--ca-line);
      }
      #ca-tabbed-catalog .ca-editor-open .ca-checks input {
        margin-top: 4px;
      }
      #ca-tabbed-catalog .ca-editor-open .ca-actions {
        justify-content: space-between;
      }
      @media (max-width: 540px) {
        #ca-tabbed-catalog .ca-row {
          flex-wrap: wrap;
          gap: 10px;
        }
        #ca-tabbed-catalog .ca-row .ca-copy {
          flex-basis: calc(100% - 52px);
        }
        #ca-tabbed-catalog .ca-row .ca-status {
          margin-left: 47px;
        }
        #ca-tabbed-catalog .ca-chevron {
          margin-left: auto;
        }
        #ca-tabbed-catalog .ca-detailtop {
          flex-wrap: wrap;
        }
        #ca-tabbed-catalog .ca-editor-open textarea[name='instructions'] {
          font-size: 16px;
        }
      }
    </style>
    <div id="ca-tabbed-catalog" aria-label="Skills and connections tabbed layout">
      <div class="ca-app" data-layout="tabs" aria-label="Tabbed catalog"></div>
    </div>
    <script>
      (() => {
        const root = document.getElementById('ca-tabbed-catalog');
        const icon = (n) => `<i data-lucide="${n}" aria-hidden="true"></i>`;
        const esc = (s) =>
          String(s).replace(
            /[&<>"']/g,
            (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
          );
        const initialSkills = [
          {
            name: 'API check',
            description: 'Check the test API endpoints and report broken ones.',
            instructions:
              'Check each allowed API endpoint. Record its status and response. Report broken endpoints with enough detail to reproduce the problem.'
          },
          {
            name: 'Claim review',
            description: 'Check a brief claim by claim against its sources.',
            instructions:
              'Read every claim in the brief. Check each against the linked source. Flag unsupported claims and suggest specific corrections.'
          },
          {
            name: 'Failure diagnosis',
            disabled: true,
            description: 'Find the likely cause of a broken API endpoint.',
            instructions:
              'Inspect the failing endpoint and compare its response with related endpoints. Explain the likely cause and the evidence behind it.'
          },
          {
            name: 'Research brief',
            description: 'Research a topic and write a brief with a source for every claim.',
            instructions:
              'Research the requested topic. Write a concise, one-page brief. Link a source for every factual claim and identify any uncertainty.'
          }
        ];
        const initialConnections = [
          {
            name: 'Pilot test API',
            description: 'The pilot test API. Read-only.',
            url: 'http://pilot-api:4100',
            paths: '/api/',
            credential: false
          },
          {
            name: 'Wikipedia (read-only)',
            description: 'Search, page summaries, and page text from English Wikipedia.',
            url: 'https://en.wikipedia.org',
            paths: '/w/api.php, /api/rest_v1/page/',
            credential: true
          }
        ];
        const badge = (x) =>
          `<span class="ca-status ${x.disabled ? 'ca-status-disabled' : 'ca-status-enabled'}">${icon(x.disabled ? 'circle-pause' : 'circle-check')}${x.disabled ? 'Disabled' : 'Enabled'}</span>`;
        const store = {};
        function persist() {}
        root.querySelectorAll('.ca-app').forEach((app) => {
          const layout = app.dataset.layout;
          const state = {
            tab: app.dataset.initialTab || 'skills',
            selected:
              app.dataset.initialItem === undefined ? null : Number(app.dataset.initialItem),
            creating: false,
            skills: structuredClone(initialSkills),
            connections: structuredClone(initialConnections),
            message: ''
          };
          store[layout] = state;

          app.innerHTML = `<aside class="ca-sidebar"><div class="ca-brand"><span class="ca-logo">CA</span><span>Collaborative<br>Agents</span></div><nav class="ca-nav" aria-label="Main navigation">${[
            ['message-square', 'Conversations'],
            ['square-check', 'Work'],
            ['shield-check', 'Approvals'],
            ['clock', 'Schedules'],
            ['bot', 'Agents'],
            ['blocks', 'Skills and connections'],
            ['settings', 'Setup']
          ]
            .map(
              ([i, n]) =>
                `<span ${n === 'Skills and connections' ? 'class="ca-active" aria-current="page"' : ''}>${icon(i)}${n}</span>`
            )
            .join(
              ''
            )}</nav><div class="ca-conversations"><div class="ca-label">Conversations</div><span># heat-pumps-cold-weather</span><span># website-check</span><span># fall-of-western-rome</span></div><div class="ca-person"><span class="ca-avatar">K</span><div>Kayvan<div class="ca-muted">Acting as you</div></div></div></aside><main class="ca-main"><header class="ca-top">Workspace <span aria-hidden="true">/</span> Skills and connections</header><div class="ca-page"><h1>Skills and connections</h1><p class="ca-intro">Reusable instructions and API connections for your agents.</p><div class="ca-note">${icon('info')}<span>Shared across the workspace. Skills are reusable instructions. Choose skills and connection access separately on each agent.</span></div><div class="ca-catalog"></div><div class="ca-message" role="status" aria-live="polite"></div></div></main>`;
          const catalog = app.querySelector('.ca-catalog');
          function tabs() {
            return `<div class="ca-tabs" aria-label="Catalog"><button class="ca-tab cursor-interaction" data-tab="skills" aria-pressed="${state.tab === 'skills'}">Skills <span class="ca-number">${state.skills.length}</span></button><button class="ca-tab cursor-interaction" data-tab="connections" aria-pressed="${state.tab === 'connections'}">Connections <span class="ca-number">${state.connections.length}</span></button></div>`;
          }
          function list(type) {
            const skill = type === 'skills';
            return `<section><div class="ca-sectionhead"><div><h2>${skill ? 'Skills' : 'Connections'}</h2><p class="ca-muted">${skill ? 'Reusable instructions for a kind of work.' : 'Outside APIs, with explicit limits.'}</p></div><button class="ca-button ${layout === 'shelves' ? '' : 'ca-primary'} cursor-interaction" data-new="${type}">${icon('plus')}New ${skill ? 'skill' : 'connection'}</button></div><div class="ca-list">${state[type].map((x, i) => `<button class="ca-row cursor-interaction" data-item="${i}" data-type="${type}" aria-pressed="${state.tab === type && state.selected === i}"><span class="ca-itemicon">${icon(skill ? 'file-text' : 'plug')}</span><span class="ca-copy"><span class="ca-name">${esc(x.name)}</span><span class="ca-description">${esc(x.description)}</span>${!skill ? `<span class="ca-rowmeta">GET only · ${x.credential ? 'Credential saved' : 'No credential'}</span>` : ''}</span>${badge(x)}<span class="ca-chevron">${icon('chevron-right')}</span></button>`).join('')}</div></section>`;
          }
          function detail() {
            const skill = state.tab === 'skills',
              isNew = state.creating,
              x = isNew ? {} : state[state.tab][state.selected];
            if (!x) return '';
            return `<section class="${layout === 'shelves' ? 'ca-inline-detail' : 'ca-detail'}" aria-label="${skill ? 'Skill' : 'Connection'} details"><button class="ca-button ca-back cursor-interaction" type="button" data-close>${icon('arrow-left')}Back to ${skill ? 'skills' : 'connections'}</button><div class="ca-detailtop"><div><span class="ca-label">${isNew ? 'New' : skill ? 'Skill details' : 'Connection details'}</span><h2>${isNew ? (skill ? 'Create a skill' : 'Create a connection') : esc(x.name)}</h2></div>${!isNew ? badge(x) : ''}</div><form class="ca-detailbody">${isNew ? `<label class="ca-field">Name<input name="name" required placeholder="${skill ? 'e.g. Research brief' : 'e.g. Support API'}"></label><label class="ca-field">Description<input name="description" required placeholder="What is this for?"></label>` : ''}${skill ? `<div><label class="ca-field">Instructions<textarea name="instructions" required>${esc(x.instructions || '')}</textarea></label><p class="ca-muted">${isNew ? 'Tell the agent how to do this work.' : 'Saving creates a new version. Agents keep their configured version until their configuration is saved again.'}</p></div>` : isNew ? `<label class="ca-field">Base URL<input type="url" name="url" placeholder="https://api.example.com" required></label><label class="ca-field">Credential header<input name="header" value="Authorization"></label><label class="ca-field">Credential (optional)<input type="password" name="credential" autocomplete="off"></label><label class="ca-field">Allowed paths<input name="paths" value="/" required></label><div class="ca-security">GET only in this layout preview. Credentials are encrypted and never shown again.</div>` : `<div class="ca-keyvalue"><span class="ca-label">Base URL</span><code>${esc(x.url)}</code></div><div class="ca-keyvalue"><span class="ca-label">Allowed requests</span><code>GET ${esc(x.paths)}</code><p class="ca-muted">No per-call approval required for these reads.</p></div><div class="ca-security"><h3>Credential</h3><p>${x.credential ? 'A credential is saved. Its value is never shown again.' : 'No credential is stored for this connection.'}</p><label class="ca-field" style="margin-top:14px">${x.credential ? 'Replace credential' : 'Add credential'}<input type="password" name="credential" autocomplete="off" placeholder="New credential" required></label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="ca-button cursor-interaction" type="submit">${x.credential ? 'Replace' : 'Save'} credential</button>${x.credential ? '<button class="ca-button cursor-interaction" type="button" data-remove>Remove credential</button>' : ''}</div></div>`}<div class="ca-actions">${skill || isNew ? `<button class="ca-button ca-primary cursor-interaction" type="submit">${isNew ? 'Create ' + (skill ? 'skill' : 'connection') : 'Save new version'}</button>` : ''}${!isNew ? `<button class="ca-button cursor-interaction" type="button" data-disable>${x.disabled ? 'Enable' : 'Disable'} ${skill ? 'skill' : 'connection'}</button>` : ''}</div></form></section>`;
          }
          function render() {
            const open = state.selected !== null || state.creating;
            catalog.innerHTML = `${tabs()}<div class="ca-content ${open ? 'ca-editor-open' : ''}">${open ? detail() : list(state.tab)}</div>`;
            app.querySelector('.ca-message').textContent = state.message;
            if (lucide) lucide.createIcons({ root: app, attrs: { width: 17, height: 17 } });
          }
          catalog.addEventListener('click', (e) => {
            const b = e.target.closest('button');
            if (!b) return;
            if (b.type === 'submit' && b.form) {
              e.preventDefault();
              if (b.form.reportValidity()) saveForm(b.form);
              return;
            }
            if (b.dataset.tab) {
              state.tab = b.dataset.tab;
              state.creating = false;
              state.selected = layout === 'workbench' ? 0 : null;
            } else if (b.hasAttribute('data-item')) {
              state.tab = b.dataset.type;
              state.selected = Number(b.dataset.item);
              state.creating = false;
            } else if (b.dataset.new) {
              state.tab = b.dataset.new;
              state.selected = null;
              state.creating = true;
            } else if (b.hasAttribute('data-close')) {
              state.selected = null;
              state.creating = false;
            } else if (b.hasAttribute('data-disable')) {
              const x = state[state.tab][state.selected];
              x.disabled = !x.disabled;
              state.message = `Preview: ${x.name} ${x.disabled ? 'disabled' : 'enabled'}.`;
            } else if (b.hasAttribute('data-remove')) {
              state.connections[state.selected].credential = false;
              state.message = 'Preview: credential removed.';
            } else return;
            render();
            persist();
          });
          function saveForm(form) {
            const data = new FormData(form),
              skill = state.tab === 'skills';
            if (state.creating) {
              state[state.tab].push(
                skill
                  ? {
                      name: data.get('name'),
                      description: data.get('description'),
                      instructions: data.get('instructions')
                    }
                  : {
                      name: data.get('name'),
                      description: data.get('description'),
                      url: data.get('url'),
                      paths: data.get('paths'),
                      credential: !!data.get('credential')
                    }
              );
              state.selected = state[state.tab].length - 1;
              state.creating = false;
              state.message =
                'Preview: added to the shared catalog. No agent has been granted access.';
            } else if (skill) {
              Object.assign(state.skills[state.selected], {
                instructions: data.get('instructions')
              });
              state.message =
                'Preview: new skill version saved. No agent configuration or connection access changed.';
            } else {
              state.connections[state.selected].credential = true;
              state.message = 'Preview: credential replaced.';
            }
            render();
            persist();
          }
          catalog.addEventListener('submit', (e) => {
            e.preventDefault();
            saveForm(e.target);
          });
          render();
        });
      })();
    </script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
